<svg xmlns="http://www.w3.org/2000/svg" width="720" height="132" viewBox="0 0 720 132" role="img">
  <defs>
    <filter id="card" x="-10%" y="-16%" width="120%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.55"/><feDropShadow dx="0" dy="10" stdDeviation="24" flood-color="#000" flood-opacity="0.45"/></filter>
    <filter id="refract" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="18"/></filter>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="rgba(255,255,255,0.10)"/>
      <stop offset="0.55" stop-color="rgba(255,255,255,0.10)" stop-opacity="0.18"/>
      <stop offset="1" stop-color="rgba(28,28,30,0.62)"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="rgba(255,255,255,0.55)"/>
      <stop offset="0.35" stop-color="rgba(255,255,255,0.16)"/>
      <stop offset="0.7" stop-color="rgba(255,255,255,0.04)"/>
      <stop offset="1" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
    <clipPath id="glassclip"><rect x="0" y="0" width="720" height="132" rx="26"/></clipPath>
  </defs>
  <g clip-path="url(#glassclip)">
    <g filter="url(#refract)">
      <circle cx="129.6" cy="15.8" r="63.4" fill="rgba(10,132,255,0.62)">
        <animate attributeName="cx" values="129.6;244.8;129.6" dur="14s" repeatCount="indefinite"/>
      </circle>
      <circle cx="619.2" cy="121.4" r="55.4" fill="rgba(191,90,242,0.52)">
        <animate attributeName="cy" values="121.4;81.8;121.4" dur="18s" repeatCount="indefinite"/>
      </circle>
    </g>
    <rect x="0" y="0" width="720" height="132" fill="url(#glass)"/>
    <rect x="0" y="0" width="720" height="132" fill="url(#sheen)">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="7s" repeatCount="indefinite"/>
    </rect>
  </g>
  <rect x="0.5" y="0.5" width="719" height="131" rx="26" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1" filter="url(#card)"/>
