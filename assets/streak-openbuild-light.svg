<svg xmlns="http://www.w3.org/2000/svg" width="720" height="120" viewBox="0 0 720 120" role="img">
  <defs>
    <filter id="card" x="-10%" y="-16%" width="120%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.06"/><feDropShadow dx="0" dy="10" stdDeviation="24" flood-color="#000" flood-opacity="0.05"/></filter>
    <filter id="refract" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="18"/></filter>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="rgba(255,255,255,0.86)"/>
      <stop offset="0.55" stop-color="rgba(255,255,255,0.86)" stop-opacity="0.55"/>
      <stop offset="1" stop-color="rgba(242,242,247,0.58)"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="rgba(255,255,255,0.55)"/>
      <stop offset="0.35" stop-color="rgba(255,255,255,0.16)"/>
      <stop offset="0.7" stop-color="rgba(255,255,255,0.04)"/>
      <stop offset="1" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
    <clipPath id="glassclip"><rect x="0" y="0" width="720" height="120" rx="26"/></clipPath>
  </defs>
  <g clip-path="url(#glassclip)">
    <g filter="url(#refract)">
      <circle cx="129.6" cy="14.4" r="57.6" fill="rgba(0,122,255,0.38)">
        <animate attributeName="cx" values="129.6;244.8;129.6" dur="14s" repeatCount="indefinite"/>
      </circle>
      <circle cx="619.2" cy="110.4" r="50.4" fill="rgba(175,82,222,0.30)">
        <animate attributeName="cy" values="110.4;74.4;110.4" dur="18s" repeatCount="indefinite"/>
      </circle>
    </g>
    <rect x="0" y="0" width="720" height="120" fill="url(#glass)"/>
    <rect x="0" y="0" width="720" height="120" fill="url(#sheen)">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="7s" repeatCount="indefinite"/>
    </rect>
  </g>
  <rect x="0.5" y="0.5" width="719" height="119" rx="26" fill="none" stroke="rgba(255,255,255,0.95)" stroke-width="1" filter="url(#card)"/>
  <rect x="108.0" y="30" width="24" height="3" rx="1.5" fill="#007AFF"/>
  <text x="120.0" y="80" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="34" font-weight="300" fill="#000000" letter-spacing="-1.5">2d</text>
  <text x="120.0" y="104" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="10" font-weight="600" fill="#8E8E93" letter-spacing="1.6">CURRENT STREAK</text>
  <rect x="348.0" y="30" width="24" height="3" rx="1.5" fill="#007AFF"/>
  <text x="360.0" y="80" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="34" font-weight="300" fill="#000000" letter-spacing="-1.5">5d</text>
  <text x="360.0" y="104" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="10" font-weight="600" fill="#8E8E93" letter-spacing="1.6">LONGEST STREAK</text>
  <rect x="588.0" y="30" width="24" height="3" rx="1.5" fill="#007AFF"/>
  <text x="600.0" y="80" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="34" font-weight="300" fill="#000000" letter-spacing="-1.5">313</text>
  <text x="600.0" y="104" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="10" font-weight="600" fill="#8E8E93" letter-spacing="1.6">TOTAL</text>
</svg>
