name: Refresh profile data

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/taxonomy.json'
      - 'data/voice.json'
      - 'templates/**'
      - 'scripts/**'

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch live data via gh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/fetch.mjs ${{ github.repository_owner }}

      - name: Render README and site payload
        run: |
          node scripts/render.mjs
          node scripts/site.mjs

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A README.md assets data/profile.json site/data.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore: refresh profile data ($(date -u +%Y-%m-%d))"
            git push
          fi
